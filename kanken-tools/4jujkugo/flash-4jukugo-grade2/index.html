<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>漢検 四字熟語クイズ</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --line: #d1d5db;
            --accent: #2563eb;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Hiragino Mincho ProN", "游明朝", "Yu Mincho", "MS PMincho", "Times New Roman", serif;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
        }

        /* 固定サイズカード（読みの位置は不動） */
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            min-height: 370px;
            /* 必要に応じて調整 */
            border-radius: 0;
            box-sizing: border-box;
            padding: 16px;
            display: grid;
            grid-template-rows: auto auto auto 1fr;
            /* 見出し / 読み行 / 漢字行 / 意味 */
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .heading {
            font-size: 14px;
            color: var(--muted);
            margin: 0;
            letter-spacing: 0.06em;
        }

        /* 方眼紙風：テーブルのような共有ボーダー */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border: 1px solid var(--line);
            border-top: none;
            /* 上段と下段を続けて方眼風に見せるため、上段は下ボーダー、下段は上下ボーダーで表現 */
        }

        /* 読み行 */
        .grid.reading-row {
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }

        /* 漢字行（領域は常に確保） */
        .grid.kanji-row {
            border-bottom: 1px solid var(--line);
        }

        /* もともとのセル高さ */
        .cell {
            display: flex;
            align-items: center;
            /* 上下中央揃え */
            justify-content: center;
            /* 左右中央揃え */
            min-height: 52px;
            /* ← 読みセルの基準はそのまま */
            border-right: 1px solid var(--line);
        }

        /* 最後の列の右線を消す */
        .cell:nth-child(4n) {
            border-right: none;
        }

        .cell.reading {
            font-size: 20px;
        }

        /* 漢字セルだけ高さを約1.3倍に増やす */
        .cell.kanji {
            font-weight: 800;
            letter-spacing: 0.04em;
            color: transparent;
            /* 初期は不可視 */
            min-height: 90px;
            /* 52px × 1.3 ≒ 67.6 → 68pxに調整 */
            font-size: 48px;
        }

        /* クリック後に漢字を見せる */
        .show-kanji .cell.kanji {
            color: var(--text);
        }

        /* 意味エリアの高さを少し減らす */
        .meaning {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 22px;
            line-height: 1.3;
            /* やや詰める（1.8 → 1.7） */
            color: var(--muted);
            border-top: 1px solid var(--line);
            /* 3.2em → 2.6em（固定カード内で小さめに） */
            overflow: hidden;
        }



        .controls {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 12px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
            border-radius: 0;
            font-family: inherit;
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .progress {
            margin-top: 8px;
            font-size: 13px;
            color: var(--muted);
        }

        .footer {
            margin-top: 8px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
        }

        .error {
            margin-top: 8px;
            color: #c0342f;
            font-size: 13px;
        }

        /* モバイル調整（任意） */
        @media (max-width: 420px) {
            .card {
                min-height: 390px;
            }

            .cell {
                min-height: 50px;
            }

            .cell.kanji {
                min-height: 80px;
                font-size: 42px;
            }

            /* モバイルでも読み比より高めを維持 */
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="card" class="card" aria-label="問題カード（クリック/タップで解答表示、もう一度で次へ）">
            <p class="heading" id="stateLabel">読み（クリックで漢字と意味を表示）</p>

            <!-- 読み 1×4（常時表示：方眼紙風） -->
            <div id="rowReading" class="grid reading-row" aria-live="polite"></div>

            <!-- 漢字 1×4（常に領域確保。初期は透明テキスト） -->
            <div id="rowKanji" class="grid kanji-row"></div>

            <!-- 意味（初期は空。クリックで描画） -->
            <div id="meaning" class="meaning"></div>
        </div>

        <div class="controls">
            <button id="toggleBtn" class="btn primary" disabled>解答表示 / 次へ</button>
            <button id="shuffleBtn" class="btn" disabled>ランダムに並べ替え</button>
            <button id="resetBtn" class="btn" disabled>最初から</button>
        </div>

        <div class="progress" id="progress">0 / 0</div>
        <div class="error" id="error" aria-live="polite"></div>
        <div class="footer">カードをクリック/タップで漢字と意味を表示。もう一度で次の問題へ。</div>
    </div>

    <script src="main.js"></script>
</body>

</html>
